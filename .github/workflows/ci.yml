name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: nothing in this workflow needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-guard:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env holds SESSION_SECRET and the Storefront API tokens. Committing it
      # is the one mistake here that a revert does not undo — the credentials
      # would have to be rotated in the Shopify admin. Fail loudly instead.
      - name: Reject tracked .env files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files are tracked in git:"
            echo "$tracked"
            echo "Remove them, then ROTATE the credentials — a revert is not enough."
            exit 1
          fi
          echo "No tracked .env files."

  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Codegen is checked in, so regenerating here proves the committed types
      # still match the queries rather than silently drifting from them.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-build-only
